name: Archive patch history

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      upstream-repo:
        description: Upstream repository to sync and archive from
        required: false
        default: nadimkobeissi/16iax10h-linux-sound-saga
      upstream-branch:
        description: Upstream branch to merge
        required: false
        default: main

concurrency:
  group: archive-patches
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: ${{ github.event.inputs['upstream-repo'] || 'nadimkobeissi/16iax10h-linux-sound-saga' }}
  UPSTREAM_BRANCH: ${{ github.event.inputs['upstream-branch'] || 'main' }}

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi

          git fetch upstream "${UPSTREAM_BRANCH}"
          git merge --no-edit "upstream/${UPSTREAM_BRANCH}"

      - name: Extract patch archive
        run: python3 extract_patches.py

      - name: Commit archive changes
        id: commit
        run: |
          mkdir -p patch-archive
          git add -f patch-archive

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "update patch archive" \
              -m "Regenerated by extract_patches.py after merging upstream ${UPSTREAM_REPO}."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        run: git push origin HEAD
