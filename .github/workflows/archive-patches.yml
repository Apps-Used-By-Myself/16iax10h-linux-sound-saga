name: Archive patch history

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      upstream-repo:
        description: Upstream repository to sync and archive from
        required: false
        default: nadimkobeissi/16iax10h-linux-sound-saga
      upstream-branch:
        description: Upstream branch to merge
        required: false
        default: main

concurrency:
  group: archive-patches
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: ${{ inputs.upstream-repo || 'nadimkobeissi/16iax10h-linux-sound-saga' }}
  UPSTREAM_BRANCH: ${{ inputs.upstream-branch || 'main' }}

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git remote get-url upstream 2>/dev/null || git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"
          git merge --no-edit "upstream/${UPSTREAM_BRANCH}"

      - name: Extract patch archive
        run: python3 extract_patches.py

      - name: Commit archive changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f patch-archive/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "update patch archive" \
              -m "Regenerated by extract_patches.py after merging upstream ${UPSTREAM_REPO}."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        run: git push origin HEAD
